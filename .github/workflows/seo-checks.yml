name: SEO Analyzer Checks
on:
  pull_request:
    paths:
      - "src/lib/seo/**"
      - "src/components/seo/**"
      - "src/app/free-seo-audit/**"
      - "src/app/api/seo/**"
      - "tests/seo/**"
      - "src/workflows/**"
      - "src/app/dashboard/seo/**"
      - "src/middleware.ts"
      - "vercel.json"
      - "package*.json"
      - "next.config.js"
      - "tsconfig.json"
      - ".github/workflows/seo-checks.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:seo
      - run: npm run build
